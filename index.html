<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Blog</title>
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <meta name="color-scheme" content="light dark">
  <script>
    // 첫 화면 깜빡임 방지: CSS가 적용되기 전에 테마를 결정합니다.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#app">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="#/">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드로 전환">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="status">불러오는 중…</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> My Blog</p>
    </div>
  </footer>

  <script>
    // 파일로 직접 열면(file://) 브라우저가 모듈 스크립트를 막으므로 여기서 안내합니다.
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<div class="notice"><h1>로컬 서버로 열어 주세요</h1>' +
        '<p>브라우저 보안 정책 때문에 <code>index.html</code>을 파일로 직접 열면 글을 읽을 수 없어요.</p>' +
        '<p>블로그 폴더에서 <code>node serve.mjs</code>를 실행한 뒤 ' +
        '<code>http://localhost:8000</code>을 열어 주세요.</p></div>';
    }
  </script>
  <!-- 미니 웹앱 카드: 글 목록 화면 위쪽에 js/app.js가 넣습니다. 새 앱은 <li class="app-card">를 추가합니다. -->
  <template id="app-cards">
    <section class="app-section" aria-labelledby="app-section-title">
      <h2 class="page-heading" id="app-section-title">미니 웹앱</h2>
      <ul class="app-list">
        <li class="app-card">
          <article>
            <h3 class="app-card-title"><a href="apps/double-tiles/">Double Tiles</a></h3>
            <p class="app-card-desc">방향키나 스와이프로 숫자 타일을 밀어 합치는 퍼즐. 64, 128, 256… 단계 목표를 깨며 최고 점수에 도전하세요.</p>
            <div class="app-card-frame">
              <iframe src="apps/double-tiles/" title="Double Tiles 게임" loading="lazy"></iframe>
            </div>
            <p class="app-card-link"><a href="apps/double-tiles/" target="_blank" rel="noopener">새 탭에서 크게 열기 ↗</a></p>
          </article>
        </li>
        <li class="app-card">
          <article>
            <h3 class="app-card-title"><a href="apps/pixel-editor/">Pixel Editor</a></h3>
            <p class="app-card-desc">16×16 격자에 도트를 찍어 그리는 픽셀 아트 에디터. 팔레트·채우기·스포이트·되돌리기를 쓰고, 완성한 그림은 PNG로 저장하세요.</p>
            <div class="app-card-frame" style="--frame-height: 700px">
              <iframe src="apps/pixel-editor/" title="Pixel Editor 픽셀 아트 에디터" loading="lazy"></iframe>
            </div>
            <p class="app-card-link"><a href="apps/pixel-editor/" target="_blank" rel="noopener">새 탭에서 크게 열기 ↗</a></p>
          </article>
        </li>
      </ul>
    </section>
  </template>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
